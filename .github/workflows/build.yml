name: CI/CD Build

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/mpvRex.jks"

      - name: Sign and verify APKs
        env:
          KEYSTORE: ${{ runner.temp }}/mpvRex.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          for apk in app/build/outputs/apk/release/*-release-unsigned.apk; do
            echo "Signing: $apk"

            signed="${apk%-unsigned.apk}-signed.apk"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$signed" \
              "$apk"

            "$APKSIGNER" verify --verbose "$signed"

            echo "Successfully signed and verified: $signed"
          done

      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-arm64-v8a-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk

      - name: Upload armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-armeabi-v7a-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk

      - name: Upload universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-universal-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-universal-release-signed.apk

      - name: Upload x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-x86-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-x86-release-signed.apk

      - name: Upload x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-x86_64-release-signed-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-x86_64-release-signed.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mpvRex.jks"
