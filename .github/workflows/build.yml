name: CI/CD Build

on:
  pull_request:
    push:
        branches:
              - master

              concurrency:
                group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
                  cancel-in-progress: true

                  jobs:
                    build:
                        runs-on: ubuntu-latest

                            steps:
                                  - name: Checkout repo
                                          uses: actions/checkout@v4

                                                - name: Generate short SHA
                                                        id: set-short-sha
                                                                run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

                                                                      - name: Setup JDK 17
                                                                              uses: actions/setup-java@v4
                                                                                      with:
                                                                                                distribution: 'adopt'
                                                                                                          java-version: 17
                                                                                                                    cache: 'gradle'

                                                                                                                          - name: Make gradlew executable
                                                                                                                                  run: chmod +x ./gradlew

                                                                                                                                        - name: Build with Gradle
                                                                                                                                                run: ./gradlew assembleRelease

                                                                                                                                                      - name: Decode keystore
                                                                                                                                                              run: |
                                                                                                                                                                        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mpvRex.jks

                                                                                                                                                                              - name: Sign APK - arm64-v8a
                                                                                                                                                                                      run: |
                                                                                                                                                                                                jarsigner -verbose -sigalg SHA384withRSA -digestalg SHA-256 \
                                                                                                                                                                                                            -keystore mpvRex.jks \
                                                                                                                                                                                                                        -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                                                                                                                                                                                                                                    -keypass "${{ secrets.KEY_PASSWORD }}" \
                                                                                                                                                                                                                                                app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
                                                                                                                                                                                                                                                            ${{ secrets.KEY_ALIAS }}
                                                                                                                                                                                                                                                                      mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
                                                                                                                                                                                                                                                                                   app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk

                                                                                                                                                                                                                                                                                         - name: Sign APK - armeabi-v7a
                                                                                                                                                                                                                                                                                                 run: |
                                                                                                                                                                                                                                                                                                           jarsigner -verbose -sigalg SHA384withRSA -digestalg SHA-256 \
                                                                                                                                                                                                                                                                                                                       -keystore mpvRex.jks \
                                                                                                                                                                                                                                                                                                                                   -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                               -keypass "${{ secrets.KEY_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                           app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                       ${{ secrets.KEY_ALIAS }}
                                                                                                                                                                                                                                                                                                                                                                                 mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                              app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                    - name: Sign APK - universal
                                                                                                                                                                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                                                                                                                                                                      jarsigner -verbose -sigalg SHA384withRSA -digestalg SHA-256 \
                                                                                                                                                                                                                                                                                                                                                                                                                                  -keystore mpvRex.jks \
                                                                                                                                                                                                                                                                                                                                                                                                                                              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                          -keypass "${{ secrets.KEY_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      app/build/outputs/apk/release/app-universal-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${{ secrets.KEY_ALIAS }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            mv app/build/outputs/apk/release/app-universal-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         app/build/outputs/apk/release/app-universal-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               - name: Sign APK - x86
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 jarsigner -verbose -sigalg SHA384withRSA -digestalg SHA-256 \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             -keystore mpvRex.jks \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     -keypass "${{ secrets.KEY_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 app/build/outputs/apk/release/app-x86-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ${{ secrets.KEY_ALIAS }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       mv app/build/outputs/apk/release/app-x86-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    app/build/outputs/apk/release/app-x86-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Sign APK - x86_64
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            jarsigner -verbose -sigalg SHA384withRSA -digestalg SHA-256 \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        -keystore mpvRex.jks \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                -keypass "${{ secrets.KEY_PASSWORD }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            app/build/outputs/apk/release/app-x86_64-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${{ secrets.KEY_ALIAS }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mv app/build/outputs/apk/release/app-x86_64-release-unsigned.apk \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               app/build/outputs/apk/release/app-x86_64-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     - name: Upload app-arm64-v8a Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               name: mpvRex-arm64-v8a-release-signed-${{ env.SHORT_SHA }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         path: app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               - name: Upload app-armeabi-v7a Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         name: mpvRex-armeabi-v7a-release-signed-${{ env.SHORT_SHA }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   path: app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         - name: Upload app-universal Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   name: mpvRex-universal-release-signed-${{ env.SHORT_SHA }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             path: app/build/outputs/apk/release/app-universal-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   - name: Upload app-x86 Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             name: mpvRex-x86-release-signed-${{ env.SHORT_SHA }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       path: app/build/outputs/apk/release/app-x86-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             - name: Upload app-x86_64 Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       name: mpvRex-x86_64-release-signed-${{ env.SHORT_SHA }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 path: app/build/outputs/apk/release/app-x86_64-release-signed.apk

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       - name: Cleanup keystore
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               run: rm -f mpvRex.jks